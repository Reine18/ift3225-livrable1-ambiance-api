$kind: http-request
name: Create Measurement
method: POST
url: '{{baseUrl}}/measurements'
description: "Enregistre une nouvelle mesure sonore. Requiert une clé API valide dans le header `x-api-key`. Les champs `soundLevel` et `amplitude` sont requis. Le champ `timestamp` est optionnel."
order: 1000
headers:
  - key: x-api-key
    value: '{{apiKey}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "soundLevel": 55.3,
      "amplitude": 0.012
    }
