$kind: http-request
name: Create Device
method: POST
url: '{{baseUrl}}/devices'
description: "Crée un nouveau device et retourne sa clé API générée automatiquement. Les champs `name` et `location` sont requis."
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Capteur A",
      "location": "Bibliothèque"
    }
